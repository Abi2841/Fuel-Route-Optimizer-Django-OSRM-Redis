version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount the current directory into the container so you don't
      # have to rebuild the image every time you change a line of code.
      - .:/app
    environment:
      - DEBUG=1
      # Tell Django to connect to the Redis container using its service name
      - CACHE_URL=redis://redis:6379/1
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # Optional: Keep Redis data persistent across container restarts
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data: